name: Build APK

on:
  push:
    branches: [ main ]
    # Docs and the server install file don't change the app, so they don't make a new release.
    paths-ignore: [ 'README.md', 'offlineu-truenas.yaml' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      # Optional: add repo secrets KEYSTORE_BASE64 + KEYSTORE_PASSWORD to sign with your own key.
      - name: Use private signing key if configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No private key set; using the project key."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=courseshelf\nkeyPassword=%s\n" \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/CourseShelf-1.0.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: CourseShelf-apk
          path: dist/*.apk

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "CourseShelf 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Download the APK below and open it on your phone to install or update." \
            --latest
